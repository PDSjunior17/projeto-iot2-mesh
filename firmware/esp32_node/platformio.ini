; Firmware do nó LoRa (Heltec WiFi LoRa 32 V3) + testes nativos do protocolo.
;   pio run -e no_lora -t upload --upload-port /dev/ttyUSB0
;   pio test -e native

[platformio]
default_envs = no_lora

[env]
lib_extra_dirs = ../arduino

[env:no_lora]
platform = espressif32@7.0.1
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; Descomente quando o módulo de cartão SD estiver ligado :
  ; -DUSAR_CARTAO_SD
lib_deps =
  RedeLoRa
  ropg/Heltec_ESP32_LoRa_v3@0.9.2
  h2zero/NimBLE-Arduino@1.4.3

[env:native]
platform = native
build_flags = -std=c++17 -lz
lib_deps = RedeLoRa
lib_compat_mode = off
test_build_src = no
